<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ไข่มุกบูรพา พัทยาน่าอยู่</title>
    <meta name="description" content="เว็บไซต์ต้นแบบนาเกลือ พร้อมเมนู Orbit Carousel">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: 'Noto Sans Thai', sans-serif;
            color: #173e38;
            background: #86bfe0
        }

        button {
            font: inherit;
            cursor: pointer
        }

        button:focus-visible {
            outline: 3px solid #f5bc58;
            outline-offset: 5px
        }

        .scene {
            min-height: 100svh;
            position: relative;
            overflow: hidden;
            isolation: isolate
        }

        .background {
            position: absolute;
            inset: 0;
            background: url('assets/naklua.png') center/cover;
            z-index: -3
        }

        .wash {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(241, 250, 241, .75), rgba(241, 250, 241, .15) 62%, rgba(14, 52, 42, .12));
            z-index: -2
        }

        .bottom {
            position: absolute;
            inset: 65% 0 0;
            background: linear-gradient(transparent, rgba(16, 51, 35, .67));
            z-index: -1
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px 4.5%;
            gap: 20px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: .04em
        }

        .mark {
            background: #1a574b;
            color: white;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            font-size: 25px
        }

        .brand small {
            display: block;
            font-size: 9px;
            letter-spacing: .23em;
            font-weight: 500
        }

        .preview {
            font-size: 11px;
            padding: 9px 15px;
            border: 1px solid #ffffffb0;
            border-radius: 30px;
            background: #ffffffa6;
            letter-spacing: .12em
        }

        .main {
            width: 91%;
            margin: 11vh auto 0;
            display: grid;
            grid-template-columns: 34% 40% 26%;
            align-items: center;
            min-height: 350px;
            position: relative
        }

        .visual {
            position: relative;
            aspect-ratio: 1;
            display: grid;
            place-items: center
        }

        .orbit {
            position: absolute;
            width: 110%;
            height: 110%;
            border: 1px solid #ffffff8c;
            border-radius: 50%;
            transform: rotate(-30deg)
        }

        .orbit:after {
            content: '';
            position: absolute;
            top: 50%;
            left: -5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f3c678;
            box-shadow: 0 0 0 6px #ffffff50
        }

        .disc {
            width: 87%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 12px solid #f9f5e6;
            box-shadow: 0 23px 45px #244f3c55, 0 0 0 1px #ffffffaa;
            background: url('assets/naklua.png') center/cover;
            transition: transform .85s cubic-bezier(.2, .7, .2, 1), opacity .45s;
            position: relative
        }

        .disc:after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 35px #203d3d30
        }

        .number {
            position: absolute;
            bottom: 8%;
            left: 5%;
            width: 56px;
            height: 56px;
            background: #1e574a;
            border: 4px solid #fff7e7;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 18px
        }

        .copy {
            padding: 0 8%;
            position: relative
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: .25em;
            font-weight: 600;
            margin-bottom: 19px
        }

        .copy h1 {
            font-size: clamp(38px, 4.7vw, 76px);
            line-height: 1.22;
            margin: 0;
            letter-spacing: -.045em;
            font-weight: 400
        }

        .copy h1 strong {
            font-weight: 700;
            display: block
        }

        .copy p {
            font-size: 14px;
            line-height: 1.9;
            max-width: 320px
        }

        .accent {
            position: absolute;
            left: -4%;
            top: 10%;
            width: 105%;
            height: 120px;
            background: #93C5FDb0;
            z-index: -1;
            border-radius: 100%;
            transform: rotate(-18deg);
            transition: background .5s
        }

        .detail {
            border-radius: 24px;
            padding: 27px;
            background: #fff9ebdf;
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 55px #264b3925;
            max-width: 280px
        }

        .detail .tag {
            font-size: 10px;
            letter-spacing: .15em;
            border-bottom: 1px solid #29544426;
            padding-bottom: 15px
        }

        .detail .count {
            font-size: 39px;
            font-weight: 700;
            margin: 19px 0 10px;
            color: #307663
        }

        .detail h2 {
            font-size: 19px;
            margin: 0 0 10px
        }

        .detail p {
            font-size: 12px;
            line-height: 1.9;
            color: #60736a
        }

        .status {
            font-size: 10px;
            margin-top: 22px;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .status:before {
            content: '';
            width: 6px;
            height: 6px;
            background: #b89950;
            border-radius: 50%
        }

        .controls {
            margin: 7vh auto 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            padding: 0 20px
        }

        .arrow {
            border: 1px solid #fff9;
            background: #fff5;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: white;
            font-size: 23px;
            backdrop-filter: blur(10px)
        }

        .tabs {
            display: flex;
            gap: 10px
        }

        .tile {
            border: 1px solid transparent;
            border-radius: 17px;
            padding: 13px 14px 11px;
            width: 94px;
            background: #ffffff26;
            color: white;
            transition: .3s;
            backdrop-filter: blur(12px)
        }

        .tile.active {
            background: #fff8e7;
            color: #214f43;
            transform: translateY(-7px);
            box-shadow: 0 7px 20px #163f3d30
        }

        .thumb {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            margin: 0 auto 8px;
            background: url('assets/naklua.png') center/cover;
            border: 2px solid #fff8
        }

        .tile span {
            font-size: 10px;
            display: block
        }

        .footer {
            display: flex;
            justify-content: space-between;
            color: #fff9;
            padding: 25px 4.5%;
            font-size: 10px;
            letter-spacing: .08em
        }

        .mobilehint {
            display: none
        }

        .live {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden
        }

        .copy,
        .detail {
            transition: opacity .2s, translate .35s
        }

        .changing .copy,
        .changing .detail {
            opacity: 0;
            translate: 0 15px
        }

        @media(min-width:1600px) {
            .main {
                margin-top: 14vh
            }

            .controls {
                margin-top: 10vh
            }
        }

        @media(max-width:800px) {
            header {
                padding: 20px 6%
            }

            .brand {
                font-size: 19px
            }

            .preview {
                font-size: 8px
            }

            .main {
                grid-template-columns: 45% 55%;
                margin-top: 10vh;
                width: 92%
            }

            .detail {
                grid-column: 1/-1;
                margin: 25px auto 0;
                max-width: 500px;
                width: 95%;
                padding: 16px 22px;
                display: grid;
                grid-template-columns: 60px 1fr;
                column-gap: 15px
            }

            .detail .tag,
            .status {
                display: none
            }

            .detail .count {
                grid-row: 1/3;
                margin: 0;
                align-self: center
            }

            .detail h2 {
                font-size: 15px
            }

            .detail p {
                margin: 0;
                font-size: 11px
            }

            .copy {
                padding-left: 9%
            }

            .copy h1 {
                font-size: 40px
            }

            .copy p {
                font-size: 11px
            }

            .eyebrow {
                font-size: 8px;
                letter-spacing: .13em
            }

            .controls {
                margin-top: 35px;
                gap: 8px
            }

            .tabs {
                gap: 5px
            }

            .tile {
                width: 60px;
                padding: 10px 4px
            }

            .thumb {
                width: 34px;
                height: 34px
            }

            .tile span {
                font-size: 8px
            }

            .arrow {
                width: 31px;
                height: 31px
            }

            .footer {
                padding-top: 22px;
                font-size: 8px
            }

            .scene {
                min-height: 100svh
            }

            .background {
                background-position: 53% center
            }

            .wash {
                background: linear-gradient(90deg, #f1faf1a8, #f1faf145)
            }

            .number {
                width: 40px;
                height: 40px;
                font-size: 12px
            }

            .disc {
                border-width: 7px
            }

            .accent {
                height: 75px
            }

            .copy p {
                margin-top: 12px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }

        /* Blue palette — edit these six values to customize the theme. */
        :root {
            --navy: #0B1D3A;
            --royal: #1E3A8A;
            --blue: #3B82B8;
            --sky: #93C5FD;
            --pale: #DBEAFE;
            --white: #F8FAFC
        }

        body {
            color: var(--navy);
            background: var(--pale)
        }

        .wash {
            background: linear-gradient(90deg, rgba(219, 234, 254, .90), rgba(219, 234, 254, .50) 58%, rgba(11, 29, 58, .20))
        }

        .bottom {
            background: linear-gradient(transparent, rgba(11, 29, 58, .87))
        }

        .mark {
            background: var(--navy);
            color: var(--white)
        }

        .preview {
            color: var(--royal);
            border-color: var(--sky);
            background: rgba(248, 250, 252, .85)
        }

        .orbit {
            border-color: rgba(147, 197, 253, .85)
        }

        .orbit:after {
            background: var(--blue);
            box-shadow: 0 0 0 6px #DBEAFE70
        }

        .disc {
            border-color: var(--white);
            box-shadow: 0 23px 45px #0B1D3A55, 0 0 0 1px #93C5FD
        }

        .number {
            background: var(--royal);
            border-color: var(--pale);
            color: var(--white)
        }

        .accent {
            background: #93C5FDb0
        }

        .detail {
            background: rgba(248, 250, 252, .94);
            border: 1px solid #DBEAFE;
            box-shadow: 0 15px 55px #0B1D3A30
        }

        .detail .tag {
            color: var(--royal);
            border-color: #93C5FD80
        }

        .detail .count {
            color: var(--royal)
        }

        .detail p {
            color: #314b70
        }

        .status {
            color: #314b70
        }

        .status:before {
            background: var(--blue)
        }

        .arrow {
            background: #0B1D3A80;
            border-color: var(--sky);
            color: var(--white)
        }

        .arrow:hover {
            background: var(--royal)
        }

        .tile {
            background: #0B1D3A80;
            color: var(--white);
            border-color: #93C5FD55
        }

        .tile:hover {
            background: #1E3A8Acc
        }

        .tile.active {
            background: var(--pale);
            color: var(--navy);
            border-color: var(--sky);
            box-shadow: 0 7px 20px #0B1D3A40
        }

        .thumb {
            border-color: var(--sky)
        }

        .footer {
            color: var(--pale)
        }

        button:focus-visible {
            outline-color: var(--blue)
        }

        @media(max-width:800px) {
            .wash {
                background: linear-gradient(90deg, #DBEAFee6, #DBEAFE88)
            }
        }

        /* ภาพคุณครู */
        .teacher-image {
            position: absolute;
            right: 26%;
            bottom: 60px;
            height: 48vh;
            max-height: 480px;
            width: auto;
            z-index: 2;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 12px 16px rgba(11, 29, 58, 0.25));
        }

        /* ให้ข้อความ การ์ด และเมนูอยู่เหนือภาพ */
        .copy,
        .detail,
        .controls {
            position: relative;
            z-index: 3;
        }

        /* ปรับภาพสำหรับหน้าจอมือถือ */
        @media (max-width: 800px) {
            .teacher-image {
                right: 2%;
                bottom: 230px;
                height: 26vh;
                max-height: 230px;
            }
        }

        /* ข้อความใหญ่: เลขหน่วยและชื่อบทเรียน */
        .copy h1 {
            font-family: "Bai Jamjuree", sans-serif;
            font-size: clamp(26.6px, 3.29vw, 53.2px);
        }

        @media (max-width: 800px) {
            .copy h1 {
                font-size: 28px;
            }
        }

        /* ลดความกว้างการ์ดเฉพาะหน้าจอมือถือ */
        @media (max-width: 800px) {
            .detail {
                width: 57%;
                margin-left: 2.5%;
                margin-right: 0;
                padding: 16px;
                grid-template-columns: 45px minmax(0, 1fr);
            }

            .detail p,
            #detailIntro {
                min-width: 0;
                white-space: normal !important;
                overflow-wrap: anywhere;
            }
        }

        @media (max-width: 800px) {

            /* ขยายช่องตัวเลขให้ใส่ 01/06 ได้ */
            .detail {
                grid-template-columns: 80px minmax(0, 1fr);
                column-gap: 10px;
            }

            .detail .count {
                display: flex;
                align-items: baseline;
                white-space: nowrap;
                font-size: 28px;
                line-height: 1.2;
            }

            .detail .count span {
                font-size: inherit !important;
                font-weight: inherit !important;
                color: inherit;
                opacity: 1 !important;
                white-space: nowrap;
            }
        }

        @media (max-width: 800px) {

            /* จัดเนื้อหาในการ์ดเรียงจากบนลงล่าง */
            .detail {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
            }

            /* ตัวเลขอยู่ด้านบน ขนาดเท่าชื่อหน่วย */
            .detail .count {
                display: flex;
                align-items: baseline;
                align-self: flex-start;
                margin: 0 0 8px;
                font-size: 15px;
                font-weight: 700;
                line-height: 1.5;
                white-space: nowrap;
            }

            .detail .count span {
                font-size: inherit !important;
                font-weight: inherit !important;
                color: inherit;
                opacity: 1 !important;
            }

            .detail h2 {
                margin: 0 0 10px;
                font-size: 15px;
                line-height: 1.5;
            }
        }

        /* ตัวเลข 01/06 ทุกขนาดหน้าจอ */
        .detail .count {
            display: flex;
            align-items: baseline;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            white-space: nowrap;
            margin: 0 0 8px;
        }

        .detail .count span {
            font-size: inherit !important;
            font-weight: inherit !important;
            color: inherit;
            opacity: 1 !important;
        }

        /* ลดขนาดวงรีหลังชื่อบทเรียน */
        .copy .accent {
            width: 40%;
            height: 55px;
            left: 8%;
            top: 45%;
            transform: rotate(-18deg);
        }

        @media (max-width: 800px) {
            .copy .accent {
                height: 35px;
            }
        }

        /* ชื่อหลักของเว็บไซต์ */
        .site-title {
            position: absolute;
            top: 16vh;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            margin: 0;
            text-align: center;

            font-family: "Bai Jamjuree", sans-serif;
            font-size: clamp(31px, 3.4vw, 53px);
            font-weight: 700;
            line-height: 1.4;
            color: #0B1D3A;
            text-shadow: 0 2px 8px rgba(248, 250, 252, 0.9);

            z-index: 4;
            pointer-events: none;
        }

        /* ชื่อหลักบนมือถือ */
        @media (max-width: 800px) {
            .site-title {
                top: 100px;
                font-size: 24px;
            }
        }

        /* โลโก้และข้อมูลผู้จัดทำ */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: normal;
        }

        .school-logo {
            width: 66px;
            height: 66px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .brand-info {
            min-width: 0;
            color: #0B1D3A;
        }

        .teacher-name {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
        }

        .brand .school-name {
            display: block;
            margin-top: 3px;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: normal;
        }

        /* สำหรับมือถือ */
        @media (max-width: 800px) {
            .brand {
                gap: 8px;
            }

            .school-logo {
                width: 48px;
                height: 48px;
            }

            .teacher-name {
                font-size: 11px;
            }

            .brand .school-name {
                font-size: 10px;
            }
        }

        /* คุณครูขยับเมื่อเปลี่ยนหน่วย */
        .teacher-image.teacher-moving {
            animation: teacher-greet 700ms ease-in-out;
            transform-origin: bottom center;
        }

        @keyframes teacher-greet {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            35% {
                transform: translateY(-12px) rotate(-2deg);
            }

            70% {
                transform: translateY(-4px) rotate(1deg);
            }
        }

        /* รองรับผู้ที่ตั้งค่าลดการเคลื่อนไหว */
        @media (prefers-reduced-motion: reduce) {
            .teacher-image.teacher-moving {
                animation: none;
            }
        }

        /* หมายเลข 1: เลขหน่วย */
        .copy h1 {
            color: #F04770 !important;
        }

        /* หมายเลข 2: ชื่อบทเรียน */
        .copy h1 strong {
            color: #E11D48 !important;
        }

        .copy h1,
        .copy h1 strong {
            font-family: "Bai Jamjuree", sans-serif;
            font-weight: 700;
        }

        /* เลื่อนชุดสไลด์ขึ้นเฉพาะคอมพิวเตอร์ */
        @media (min-width: 801px) {
            .controls {
                transform: translateY(-180px);
            }
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            padding: 9px 14px;
            border: 1px solid #93C5FD;
            border-radius: 30px;
            background: #F8FAFC;
            color: #0B1D3A;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .sound-toggle {
                top: 20px;
                bottom: auto;
                right: 12px;
                padding: 7px 10px;
                font-size: 11px;
            }
        }

        /* ข้อความยินดีต้อนรับ */
        .copy .eyebrow {
            position: relative;
            top: 10px;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 0.05em;
        }

        a.disc,
        a.detail {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        a.disc {
            display: block;
        }

        a.disc:focus-visible,
        a.detail:focus-visible {
            outline: 3px solid #E11D48;
            outline-offset: 5px;
        }

        .orbit,
        .number,
        .disc::after {
            pointer-events: none;
        }

        /* ขยับข้อความทั้งชุดให้ชิดวงกลมบนคอมพิวเตอร์ */
        @media (min-width: 801px) {
            .copy {
                padding-left: 0;
                left: -40px;
            }
        }

        /* กรอบข้อความทั้งชุด */
        .copy {
            isolation: isolate;
            padding: 20px 24px;
            border-radius: 12px;
        }

        /* เปลี่ยนวงรีเป็นสี่เหลี่ยมเต็มกรอบ */
        .copy .accent {
            inset: 0;
            width: 100%;
            height: 100%;
            transform: none;
            border-radius: inherit;
            z-index: -1;
        }

        /* จัดข้อความยินดีต้อนรับให้อยู่ภายในกรอบ */
        .copy .eyebrow {
            top: 0;
            margin-bottom: 12px;
        }

        /* มือถือ */
        @media (max-width: 800px) {
            .copy {
                padding: 12px;
            }
        }

        @media (min-width: 801px) {
            .copy {
                /* ขยับซ้ายเพิ่มประมาณ 5% ของความกว้างชุดข้อความ */
                transform: translateX(-5%);

                /* ลดความกว้างกรอบ เหลือ 65% ของช่องเดิม */
                width: 65%;
                padding: 16px 20px;
            }

            .copy .accent {
                inset: 0;
                width: 100%;
                height: 100%;
            }
        }

        /* เฉพาะมือถือ: เท้าคุณครูชิดขอบล่าง */
        @media (max-width: 800px) {
            .teacher-image {
                top: auto;
                bottom: 20;
            }
        }

        @media (max-width: 800px) {
            .teacher-image {
                height: 65vh;
                /* เดิม 26vh × 1.5*/
                max-height: 575px;
                /* เดิม 230px × 1.5 */
                width: auto;
                top: auto;
                bottom: 0;
                right: 2%;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="scene" id="scene">
        <div class="background"></div>
        <div class="wash"></div>
        <div class="bottom"></div>
        <img src="assets/teachersea1.png" alt="คุณครูแนะนำบทเรียนวัฒนธรรมชุมชน" class="teacher-image">
        <header>
            <div class="brand">
                <img src="assets/logopattaya3.png" alt="ตราโรงเรียนเมืองพัทยา 3" class="school-logo">

                <div class="brand-info">
                    <div class="teacher-name">
                        นางสาวศิริพร บำรุงกิจวิทยา
                    </div>

                    <small class="school-name">
                        โรงเรียนเมืองพัทยา 3 (วัดสว่างฟ้าพฤฒาราม)
                    </small>
                </div>
            </div>
        </header>
        <h1 class="site-title">ไข่มุกบูรพา พัทยาน่าอยู่</h1>
        <section class="main">
            <div class="visual">
                <div class="orbit"></div>
                <a class="disc" id="disc" href="pattayakrusea1.html" aria-label="เข้าสู่หน่วยที่ 1"></a>
                <div class="number" id="number">01</div>
            </div>
            <div class="copy">
                <div class="accent" id="accent"></div>
                <div class="eyebrow">ยินดีต้อนรับสู่การเดินทาง</div>
                <h1 id="title">เรื่องราวของ<strong>นาเกลือ</strong></h1>
                <p id="intro" hidden></p>
            </div>
            <a class="detail" id="unitLink" href="pattayakrusea1.html">
                <div class="tag">เรียนรู้วัฒนธรรม เคารพความต่าง</div>
                <div class="count" id="count">01<span>/06</span>
                </div>
                <h2 id="detailTitle">หัวข้อ 01</h2>
                <p id="detailIntro" style="white-space: pre-line;"></p>
                <div class="status">เนื้อหาตัวอย่าง · รอรายละเอียด</div>
            </a>
        </section>
        <nav class="controls" aria-label="เลือกหัวข้อ"><button class="arrow" id="prev"
                aria-label="หัวข้อก่อนหน้า">‹</button>
            <div class="tabs" id="tabs" role="tablist"></div><button class="arrow" id="next"
                aria-label="หัวข้อถัดไป">›</button>
        </nav>
        <footer class="footer"><span>เลื่อนเมาส์ · ปัดหน้าจอ · หรือกดลูกศรเพื่อสำรวจ</span><span id="progress">01 —
                06</span></footer>
        <p class="live" aria-live="polite" id="live"></p>
    </main>
    <script>
        // ===== แก้ชื่อและเพิ่มหัวข้อได้ตรงนี้ =====
        const slides = [
            {
                title: "หน่วยที่ 1",
                name: "วัดคู่ชุมชน",
                image: "assets/หน่วยที่1.png",
                pos: "50% 45%",
                color: "#93C5FDb0",
                intro: "เรียนรู้ผู้คน เคารพศรัทธา\nวัดมีความสำคัญต่อผู้คนอย่างไร และเราควรปฏิบัติตนอย่างไรเมื่อไปเยือน"
            },
            {
                title: "หน่วยที่ 2",
                name: "วันไหลสุขใจ",
                image: "assets/หน่วยที่2.png",
                pos: "10% 70%",
                color: "#DBEAFEcc",
                intro: "วันไหลสุขใจ สืบสานประเพณี เล่นน้ำดีมีวินัย\nการร่วมประเพณีวันไหลให้เกิดประโยชน์และเคารพผู้อื่นควรทำอย่างไร"
            },
            {
                title: "หน่วยที่ 3",
                name: "กินเจใจงาม",
                image: "assets/หน่วยที่3.png",
                pos: "90% 40%",
                color: "#93C5FDcc",
                intro: "กินเจใจงาม เมตตาต่อกัน\nแม้เรามีความเชื่อต่างกัน เราจะเข้าใจและปฏิบัติต่อกันอย่างไร"
            },
            {
                title: "หน่วยที่ 4",
                name: "กองข้าวแบ่งปัน",
                image: "assets/หน่วยที่4.png",
                pos: "52% 95%",
                color: "#3B82B855",
                intro: "กองข้าวแบ่งปัน ผูกสัมพันธ์ชุมชน\nประเพณีนี้มีคุณค่าต่อชุมชนอย่างไร และแต่ละคนมีส่วนร่วมได้อย่างไร"
            },
            {
                title: "หน่วยที่ 5",
                name: "ครูยอดธงคนดี",
                image: "assets/หน่วยที่5.png",
                pos: "65% 70%",
                color: "#DBEAFEcc",
                intro: "ครูยอดธงคนดี ทำความดีเพื่อชุมชน\nผลงานใดแสดงว่าบุคคลหนึ่งทำประโยชน์แก่ชุมชน"
            },
            {
                title: "หน่วยที่ 6",
                name: "พัทยาหลากหลาย",
                image: "assets/หน่วยที่6.png",
                pos: "35% 60%",
                color: "#93C5FDb0",
                intro: "พัทยาหลากหลาย อยู่ร่วมกันได้ด้วยความเข้าใจ\nผู้คนมีวิถีชีวิตแตกต่างกันอย่างไร และเราจะอยู่ร่วมกันอย่างเข้าใจได้อย่างไร"
            }
        ];

        // นับจำนวนหัวข้ออัตโนมัติ
        const total = slides.length;

        let current = 0;
        let busy = false;

        const tabs = document.getElementById("tabs");
        const scene = document.getElementById("scene");
        const disc = document.getElementById("disc");

        // ล้างเมนูเดิม แล้วสร้างเมนูตามข้อมูลด้านบน
        tabs.replaceChildren();

        slides.forEach((slide, index) => {
            const button = document.createElement("button");

            button.className = "tile";
            button.setAttribute("role", "tab");
            button.setAttribute("aria-label", slide.title);

            const thumb = document.createElement("div");
            thumb.className = "thumb";
            thumb.style.backgroundImage = `url("${slide.image}")`;
            thumb.style.backgroundPosition = "center";
            thumb.style.backgroundSize = "cover";

            const label = document.createElement("span");
            label.textContent = slide.title;

            button.append(thumb, label);
            button.addEventListener("click", () => select(index));

            tabs.appendChild(button);
        });

        // แสดงชื่อ รูปภาพ และจำนวนหัวข้อให้ตรงกันทุกจุด
        function render(index) {
            const slide = slides[index];
            const number = String(index + 1).padStart(2, "0");
            const totalNumber = String(total).padStart(2, "0");

            // ข้อความใหญ่ตรงกลาง
            const title = document.getElementById("title");
            const strong = document.createElement("strong");
            strong.textContent = slide.name;
            title.replaceChildren(document.createTextNode(slide.title), strong);

            // คำอธิบายของหน่วยในการ์ดด้านขวา
            document.getElementById("detailIntro").textContent = slide.intro ?? "";

            // ลิงก์ทั้งภาพวงกลมและการ์ด ใช้หน่วยเดียวกัน
            const pageUrl = `pattayakrusea${index + 1}.html`;
            const linkLabel = `เข้าสู่${slide.title} ${slide.name}`;
            for (const link of [disc, document.getElementById("unitLink")]) {
                link.href = pageUrl;
                link.setAttribute("aria-label", linkLabel);
            }

            document.getElementById("number").textContent = number;
            const totalLabel = document.createElement("span");
            totalLabel.textContent = "/" + totalNumber;
            document.getElementById("count").replaceChildren(
                document.createTextNode(number), totalLabel
            );
            document.getElementById("detailTitle").textContent =
                slide.title + " " + slide.name;
            document.getElementById("progress").textContent =
                number + " — " + totalNumber;
            document.getElementById("accent").style.background = slide.color;
            disc.style.backgroundImage = `url("${slide.image}")`;
            disc.style.backgroundPosition = "center";
            disc.style.backgroundSize = "cover";

            [...tabs.children].forEach((button, itemIndex) => {
                const selected = itemIndex === index;
                button.classList.toggle("active", selected);
                button.setAttribute("aria-selected", String(selected));
            });
            document.getElementById("live").textContent =
                slide.title + " " + slide.name + " จากทั้งหมด " + total + " หน่วย";
        }

        // เปลี่ยนหัวข้อพร้อมเอฟเฟกต์หมุน
        function select(index) {
            const nextIndex = (index + total) % total;

            if (nextIndex === current || busy) return;

            busy = true;

            const direction = index > current ? 1 : -1;
            current = nextIndex;
            playSlideSound();
            // เริ่มการเคลื่อนไหวของคุณครูใหม่ทุกครั้ง
            const teacher = document.querySelector(".teacher-image");
            if (teacher) {
                teacher.classList.remove("teacher-moving");
                void teacher.offsetWidth;
                teacher.classList.add("teacher-moving");
            }

            scene.classList.add("changing");

            disc.style.transform =
                `translate(${-direction * 35}px, 45px)
       rotate(${-direction * 45}deg) scale(.8)`;

            disc.style.opacity = "0";

            setTimeout(() => {
                try {
                    render(current);
                } finally {
                    disc.style.transform = "translate(0, 0) rotate(0deg) scale(1)";
                    disc.style.opacity = "1";
                    scene.classList.remove("changing");
                    setTimeout(() => { busy = false; }, 500);
                }
            }, 250);
        }

        // ปุ่มลูกศรบนหน้าเว็บ
        document.getElementById("prev").onclick = () => {
            select(current - 1);
        };

        document.getElementById("next").onclick = () => {
            select(current + 1);
        };

        // ปุ่มลูกศรบนคีย์บอร์ด
        window.addEventListener("keydown", (event) => {
            if (
                event.key === "ArrowRight" ||
                event.key === "ArrowDown"
            ) {
                event.preventDefault();
                select(current + 1);
            }

            if (
                event.key === "ArrowLeft" ||
                event.key === "ArrowUp"
            ) {
                event.preventDefault();
                select(current - 1);
            }
        });

        // เลื่อนเมาส์เพื่อเปลี่ยนหัวข้อ
        window.addEventListener("wheel", (event) => {
            if (Math.abs(event.deltaY) > 20) {
                select(current + (event.deltaY > 0 ? 1 : -1));
            }
        }, { passive: true });

        // ปัดหน้าจอมือถือ
        let startX = 0;

        window.addEventListener("touchstart", (event) => {
            startX = event.changedTouches[0].clientX;
        }, { passive: true });

        window.addEventListener("touchend", (event) => {
            const distance =
                startX - event.changedTouches[0].clientX;

            if (Math.abs(distance) > 50) {
                select(current + (distance > 0 ? 1 : -1));
            }
        }, { passive: true });

        // แสดงหัวข้อแรกเมื่อเปิดเว็บไซต์
        render(current);
    </script>
    <audio id="bgMusic" loop preload="metadata">
        <source src="assets/background-music.mp3" type="audio/mpeg">
    </audio>

    <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="false">
        🎵 เปิดเพลง
    </button>

    <script>
        const bgMusic = document.getElementById("bgMusic");
        const soundToggle = document.getElementById("soundToggle");

        let soundEnabled = false;
        let soundContext;
        // เตรียมเสียงเอฟเฟกต์เมื่อผู้ชมเริ่มใช้งาน
        function prepareSlideAudio() {
            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) return;

            soundContext ??= new AudioContextClass();

            if (soundContext.state === "suspended") {
                soundContext.resume().catch(console.error);
            }
        }

        window.addEventListener("pointerdown", prepareSlideAudio);
        window.addEventListener("touchstart", prepareSlideAudio, {
            passive: true
        });
        window.addEventListener("keydown", prepareSlideAudio);
        // ระดับเสียงเพลงพื้นหลัง 15%
        bgMusic.volume = 0.15;

        soundToggle.addEventListener("click", async () => {
            if (soundEnabled) {
                soundEnabled = false;
                bgMusic.pause();
                soundToggle.textContent = "🎵 เปิดเพลง";
                soundToggle.setAttribute("aria-pressed", "false");
                return;
            }

            try {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                if (AudioContextClass) {
                    soundContext ??= new AudioContextClass();
                    await soundContext.resume();
                }

                await bgMusic.play();

                soundEnabled = true;
                soundToggle.textContent = "🎵 ปิดเพลง";
                soundToggle.setAttribute("aria-pressed", "true");
            } catch (error) {
                soundToggle.textContent = "🎵 ลองเปิดเพลงอีกครั้ง";
                console.error("เปิดเสียงไม่สำเร็จ:", error);
            }
        });

        // เสียงเปลี่ยนสไลด์ ทำงานแยกจากปุ่มเปิด–ปิดเพลง
        function playSlideSound() {
            prepareSlideAudio();

            if (!soundContext) return;

            const playTone = () => {
                const oscillator = soundContext.createOscillator();
                const gain = soundContext.createGain();
                const now = soundContext.currentTime;

                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(880, now);
                oscillator.frequency.exponentialRampToValueAtTime(
                    1320, now + 0.12
                );

                gain.gain.setValueAtTime(0, now);

                // เดิม 0.08 → 0.12 เพิ่มระดับสัญญาณเสียง 50%
                gain.gain.linearRampToValueAtTime(0.12, now + 0.015);

                gain.gain.exponentialRampToValueAtTime(
                    0.001, now + 0.25
                );

                oscillator.connect(gain);
                gain.connect(soundContext.destination);

                oscillator.start(now);
                oscillator.stop(now + 0.26);

                oscillator.onended = () => {
                    oscillator.disconnect();
                    gain.disconnect();
                };
            };

            if (soundContext.state === "running") {
                playTone();
            } else if (soundContext.state === "suspended") {
                soundContext.resume().then(() => {
                    if (soundContext.state === "running") playTone();
                }).catch(console.error);
            }
        }
    </script>
